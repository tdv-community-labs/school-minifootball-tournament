    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, function(tag) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[tag] || tag;
      });
    }

    // Safety net: catch any uncaught script or module errors and replace spinning loader
    window.addEventListener('error', function(e) {
      console.error('TDV Sports System Error:', e);
      const root = document.getElementById('root');
      if (root && root.innerHTML.includes('animate-spin')) {
        root.innerHTML = `

    // 1. Instant theme hydration to prevent FOUC
    (function() {
      try {
        const theme = localStorage.getItem('btl_theme') || localStorage.getItem('tdv_theme') || 'system';
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = theme === 'dark' || (theme === 'system' && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    })();
  </script>

  <!-- Global Particle System -->
  <script id="tdv-particles-script">
    (function() {
      const canvas = document.getElementById('tdv-particles-bg');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      let particlesArray = [];
      let animationFrameId;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 2 + 0.1;
          this.speedX = (Math.random() - 0.5) * 0.3;
          this.speedY = (Math.random() - 0.5) * 0.3;
          this.opacity = Math.random() * 0.4 + 0.1;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x > canvas.width) this.x = 0;
          else if (this.x < 0) this.x = canvas.width;
          if (this.y > canvas.height) this.y = 0;
          else if (this.y < 0) this.y = canvas.height;
        }
        draw() {
          ctx.fillStyle = `rgba(34, 197, 94, ${this.opacity})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      
      function init() {
        particlesArray = [];
        const numberOfParticles = Math.floor((canvas.width * canvas.height) / 15000);
        for (let i = 0; i < numberOfParticles; i++) {
          particlesArray.push(new Particle());
        }
      }
      
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
          particlesArray[i].update();
          particlesArray[i].draw();
        }
        animationFrameId = requestAnimationFrame(animate);
      }
      
      init();
      animate();
      
      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        init();
      });
    })();
  </script>

  <script id="tdv-premium-audio-engine">
    (function() {
      class CyberpunkAudioEngine {
        constructor() {
          this.ctx = null;
          this.initialized = false;
        }
        init() {
          if (!this.initialized) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) {
              this.ctx = new AudioContextClass();
              this.initialized = true;
            }
          }
        }
        playTone(freq, type, duration, vol) {
          if (!this.ctx) return;
          try {
            const osc = this.ctx.createOscillator();
            const gainNode = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gainNode.gain.setValueAtTime(vol, this.ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
            osc.connect(gainNode);
            gainNode.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
          } catch(e) {}
        }
        playHover() { this.playTone(800, 'sine', 0.05, 0.03); }
        playClick() { this.playTone(1200, 'square', 0.1, 0.05); }
      }
      
      const audio = new CyberpunkAudioEngine();
      
      // Initialize on first interaction
      document.addEventListener('click', () => audio.init(), { once: true });
      document.addEventListener('keydown', () => audio.init(), { once: true });

      // Delegate hover/click sounds globally
      document.body.addEventListener('mouseenter', (e) => {
        if (e.target && e.target.closest && e.target.closest('a, button, input, textarea, select, [role="button"], .clickable')) {
          audio.playHover();
        }
      }, true); // useCapture true for mouseenter delegation

      document.body.addEventListener('mousedown', (e) => {
        if (e.target && e.target.closest && e.target.closest('a, button, input, textarea, select, [role="button"], .clickable')) {
          audio.playClick();
        }
      }, true);
    })();
  </script>
  <!-- TDV Global Particle Background -->
  <canvas id="tdv-global-particles" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -9999; pointer-events: none; opacity: 0.3;"></canvas>
  <script id="tdv-particle-engine">
    (function() {
      const canvas = document.getElementById('tdv-global-particles');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let particles = [];
      let w, h;
      
      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.vx = (Math.random() - 0.5) * 0.8;
          this.vy = (Math.random() - 0.5) * 0.8;
          this.size = Math.random() * 1.5 + 0.5;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0 || this.x > w) this.vx *= -1;
          if (this.y < 0 || this.y > h) this.vy *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(34, 197, 94, 0.4)';
          ctx.fill();
        }
      }

      for (let i = 0; i < 40; i++) particles.push(new Particle());

      function animate() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => { p.update(); p.draw(); });
        
        ctx.lineWidth = 0.5;
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 100) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(34, 197, 94, ${0.15 - (dist/100)*0.15})`;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>

  


  <!-- TDV Premium Magnetic UX Engine -->
  <script id="tdv-magnetic-ux">
    (function() {
      // Wait for DOM to be fully ready
      document.addEventListener('DOMContentLoaded', () => {
        const magneticElements = document.querySelectorAll('button, a.tdv-nexus-item, .glass-card, a.btn');
        
        magneticElements.forEach(elem => {
          // Add smooth transition for the spring-back effect
          elem.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
          
          elem.addEventListener('mousemove', (e) => {
            const rect = elem.getBoundingClientRect();
            // Calculate mouse position relative to the center of the element
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            // Limit the movement to a max of 10px in any direction
            const moveX = x * 0.15;
            const moveY = y * 0.15;
            
            // Apply the transform, removing the transition temporarily so it tracks instantly
            elem.style.transition = 'none';
            elem.style.transform = `translate(${moveX}px, ${moveY}px)`;
          });
          
          elem.addEventListener('mouseleave', () => {
            // Restore transition and snap back to origin
            elem.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            elem.style.transform = 'translate(0px, 0px)';
          });
        });
      });
    })();
  </script>


  <!-- TDV Global Scroll Reveal Animations -->
  <style id="tdv-scroll-reveal-styles">
    .tdv-reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .tdv-reveal.active {
      opacity: 1;
      transform: translateY(0);
    }
    .tdv-reveal-delay-1 { transition-delay: 100ms; }
    .tdv-reveal-delay-2 { transition-delay: 200ms; }
    .tdv-reveal-delay-3 { transition-delay: 300ms; }
  </style>
  <script id="tdv-scroll-reveal-script">
    (function() {
      document.addEventListener('DOMContentLoaded', () => {
        // Find main content sections, cards, and titles
        const elementsToAnimate = document.querySelectorAll('section, .glass-card, .ui-card, h1, h2, h3, .grid > div');
        elementsToAnimate.forEach((el, index) => {
          if (!el.classList.contains('tdv-reveal')) {
            el.classList.add('tdv-reveal');
            // Stagger animation delays for grid items
            if (index % 3 === 1) el.classList.add('tdv-reveal-delay-1');
            if (index % 3 === 2) el.classList.add('tdv-reveal-delay-2');
          }
        });
        
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('active');
              // Optional: stop observing once revealed
              // observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.05, rootMargin: '0px 0px -50px 0px' });
        
        document.querySelectorAll('.tdv-reveal').forEach(el => observer.observe(el));
      });
    })();
  </script>

  <script id="tdv-context-script">
    (function() {
      document.addEventListener('DOMContentLoaded', () => {
        const menu = document.getElementById('tdv-context-menu');
        
        document.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          
          let x = e.clientX;
          let y = e.clientY;
          
          // Ensure menu doesn't go out of bounds
          const menuWidth = 220;
          const menuHeight = 180;
          
          if (x + menuWidth > window.innerWidth) x = window.innerWidth - menuWidth - 10;
          if (y + menuHeight > window.innerHeight) y = window.innerHeight - menuHeight - 10;
          
          menu.style.left = `${x}px`;
          menu.style.top = `${y}px`;
          menu.classList.add('active');
        });
        
        document.addEventListener('click', (e) => {
          if (!menu.contains(e.target)) {
            menu.classList.remove('active');
          }
        });
        
        // Let escape key close it
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') menu.classList.remove('active');
        });
      });
    })();
  </script>


  <!-- TDV 3D Tilt Parallax Engine -->
  <script id="tdv-tilt-script">
    (function() {
      document.addEventListener('DOMContentLoaded', () => {
        const tiltCards = document.querySelectorAll('.glass-card, .ui-card');
        
        tiltCards.forEach(card => {
          // Add transition for when mouse leaves
          card.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
          card.style.transformStyle = 'preserve-3d';
          
          card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            // Calculate mouse position relative to the center of the card
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            // Calculate rotation (max 8 degrees)
            const rotateX = ((y - centerY) / centerY) * -8;
            const rotateY = ((x - centerX) / centerX) * 8;
            
            card.style.transition = 'none';
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
          });
          
          card.addEventListener('mouseleave', () => {
            card.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)';
          });
        });
      });
    })();
  </script>


  <!-- TDV Page Transition Curtain -->
  <style id="tdv-page-transition-styles">
    #tdv-transition-curtain {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #09090b;
      z-index: 999999999;
      pointer-events: none;
      transform: translateY(-100%);
      transition: transform 0.5s cubic-bezier(0.65, 0, 0.35, 1);
    }
    #tdv-transition-curtain.slide-down {
      transform: translateY(0%);
    }
    #tdv-transition-curtain.slide-up {
      transform: translateY(100%);
    }
  </style>
  <div id="tdv-transition-curtain"></div>
  <script id="tdv-page-transition-script">
    (function() {
      // On Initial Load (Slide Up)
      const curtain = document.getElementById('tdv-transition-curtain');
      curtain.style.transform = 'translateY(0%)'; // start covered
      
      window.addEventListener('load', () => {
        // Slide it up away after everything loads
        setTimeout(() => {
          curtain.classList.add('slide-up');
        }, 100);
      });

      // Intercept Link Clicks (Slide Down)
      document.addEventListener('click', (e) => {
        const link = e.target.closest('a');
        if (link && link.href && !link.target && link.hostname === window.location.hostname && !link.href.includes('#')) {
          e.preventDefault();
          curtain.classList.remove('slide-up');
          curtain.classList.add('slide-down');
          
          setTimeout(() => {
            window.location.href = link.href;
          }, 450);
        }
      });
      
      // Fix for browsers caching the page state when using back button
      window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
          curtain.classList.remove('slide-down');
          curtain.classList.add('slide-up');
        }
      });
    })();
  </script>
