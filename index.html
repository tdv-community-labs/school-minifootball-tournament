    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, function(tag) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[tag] || tag;

        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = theme === 'dark' || (theme === 'system' && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    })();

  <!-- Global Particle System -->
  <script id="tdv-particles-script">
    (function() {
      const canvas = document.getElementById('tdv-particles-bg');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      let particlesArray = [];
      let animationFrameId;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 2 + 0.1;
          this.speedX = (Math.random() - 0.5) * 0.3;
          this.speedY = (Math.random() - 0.5) * 0.3;
          this.opacity = Math.random() * 0.4 + 0.1;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x > canvas.width) this.x = 0;
          else if (this.x < 0) this.x = canvas.width;
          if (this.y > canvas.height) this.y = 0;
          else if (this.y < 0) this.y = canvas.height;
        }
        draw() {
          ctx.fillStyle = `rgba(34, 197, 94, ${this.opacity})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      
      function init() {
        particlesArray = [];
        const numberOfParticles = Math.floor((canvas.width * canvas.height) / 15000);
        for (let i = 0; i < numberOfParticles; i++) {
          particlesArray.push(new Particle());
        }
      }
      
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
          particlesArray[i].update();
          particlesArray[i].draw();
        }
        animationFrameId = requestAnimationFrame(animate);
      }
      
      init();
      animate();
      
      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        init();
      });
    })();
  </script>

  <script id="tdv-premium-audio-engine">
    (function() {
      class CyberpunkAudioEngine {
        constructor() {
          this.ctx = null;
          this.initialized = false;
        }
        init() {
          if (!this.initialized) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) {
              this.ctx = new AudioContextClass();
              this.initialized = true;
            }
          }
        }
        playTone(freq, type, duration, vol) {
          if (!this.ctx) return;
          try {
            const osc = this.ctx.createOscillator();
            const gainNode = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gainNode.gain.setValueAtTime(vol, this.ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
            osc.connect(gainNode);
            gainNode.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
          } catch(e) {}
        }
        playHover() { this.playTone(800, 'sine', 0.05, 0.03); }
        playClick() { this.playTone(1200, 'square', 0.1, 0.05); }
      }
      
      const audio = new CyberpunkAudioEngine();
      
      // Initialize on first interaction
      document.addEventListener('click', () => audio.init(), { once: true });
      document.addEventListener('keydown', () => audio.init(), { once: true });

      // Delegate hover/click sounds globally
      document.body.addEventListener('mouseenter', (e) => {
        if (e.target && e.target.closest && e.target.closest('a, button, input, textarea, select, [role="button"], .clickable')) {
          audio.playHover();
        }
      }, true); // useCapture true for mouseenter delegation

      document.body.addEventListener('mousedown', (e) => {
        if (e.target && e.target.closest && e.target.closest('a, button, input, textarea, select, [role="button"], .clickable')) {
          audio.playClick();
        }
      }, true);
    })();
  </script>

  <script id="tdv-particle-engine">
    (function() {
      const canvas = document.getElementById('tdv-global-particles');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let particles = [];
      let w, h;
      
      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.vx = (Math.random() - 0.5) * 0.8;
          this.vy = (Math.random() - 0.5) * 0.8;
          this.size = Math.random() * 1.5 + 0.5;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0 || this.x > w) this.vx *= -1;
          if (this.y < 0 || this.y > h) this.vy *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(34, 197, 94, 0.4)';
          ctx.fill();
        }
      }

      for (let i = 0; i < 40; i++) particles.push(new Particle());

      function animate() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => { p.update(); p.draw(); });
        
        ctx.lineWidth = 0.5;
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 100) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(34, 197, 94, ${0.15 - (dist/100)*0.15})`;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>

  <script id="tdv-nexus-script">
    (function() {
      const btn = document.getElementById('tdv-nexus-btn');
      const menu = document.getElementById('tdv-nexus-menu');
      let isOpen = false;
      
      if (!btn || !menu) return;
      
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        isOpen = !isOpen;
        if (isOpen) {
          menu.classList.add('active');
          btn.style.transform = 'rotate(45deg) scale(0.9)';
        } else {
          menu.classList.remove('active');
          btn.style.transform = 'none';
        }
      });
      
      document.addEventListener('click', (e) => {
        if (isOpen && !menu.contains(e.target) && e.target !== btn) {
          isOpen = false;
          menu.classList.remove('active');
          btn.style.transform = 'none';
        }
      });
    })();
  </script>
