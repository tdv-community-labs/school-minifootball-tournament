  <script>
    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, function(tag) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[tag] || tag;
      });

    // Safety net: catch any uncaught script or module errors and replace spinning loader
    window.addEventListener('error', function(e) {
      console.error('TDV Sports System Error:', e);
      const root = document.getElementById('root');
      if (root && root.innerHTML.includes('animate-spin')) {
        root.innerHTML = `
          <div class="min-h-screen flex flex-col items-center justify-center bg-zinc-950 text-white p-6 text-center">

    // 1. Instant theme hydration to prevent FOUC
    (function() {
      try {
        const theme = localStorage.getItem('btl_theme') || localStorage.getItem('tdv_theme') || 'system';
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = theme === 'dark' || (theme === 'system' && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    })();
  </script>

  <script id="tdv-premium-cursor-script">
    (function() {
      if (window.matchMedia('(pointer: coarse)').matches) return;
      
      const dot = document.getElementById('tdv-custom-cursor-dot');
      const ring = document.getElementById('tdv-custom-cursor-ring');
      const g1 = document.getElementById('tdv-custom-cursor-ghost1');
      const g2 = document.getElementById('tdv-custom-cursor-ghost2');
      const shockwave = document.getElementById('tdv-custom-cursor-shockwave');
      
      let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
      let ringX = mouseX, ringY = mouseY;
      let g1X = mouseX, g1Y = mouseY;
      let g2X = mouseX, g2Y = mouseY;
      let prevX = mouseX, prevY = mouseY;
      
      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        dot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
      });
      
      function animate() {
        // Velocity Squeeze
        const dx = mouseX - prevX;
        const dy = mouseY - prevY;
        const speed = Math.min(Math.sqrt(dx * dx + dy * dy) * 0.02, 0.4);
        const angle = Math.atan2(dy, dx) * (180 / Math.PI);
        prevX = mouseX; prevY = mouseY;
        
        // Spring physics
        ringX += (mouseX - ringX) * 0.25;
        ringY += (mouseY - ringY) * 0.25;
        g1X += (ringX - g1X) * 0.2;
        g1Y += (ringY - g1Y) * 0.2;
        g2X += (g1X - g2X) * 0.15;
        g2Y += (g1Y - g2Y) * 0.15;
        
        const isClicking = document.body.classList.contains('cursor-clicking');
        
        ring.style.transform = `translate(${ringX}px, ${ringY}px) translate(-50%, -50%) rotate(${angle}deg) scale(${1 + speed}, ${1 - speed}) scale(${isClicking ? 0.85 : 1})`;
        g1.style.transform = `translate(${g1X}px, ${g1Y}px) translate(-50%, -50%)`;
        g2.style.transform = `translate(${g2X}px, ${g2Y}px) translate(-50%, -50%)`;
        
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
      
      document.addEventListener('mouseover', (e) => {
        if (e.target.closest('a, button, input, textarea, select, [role="button"], .clickable')) {
          document.body.classList.add('cursor-hover');
        }
      });
      document.addEventListener('mouseout', (e) => {
        if (e.target.closest('a, button, input, textarea, select, [role="button"], .clickable')) {
          document.body.classList.remove('cursor-hover');
        }
      });
      document.addEventListener('mousedown', () => {
        document.body.classList.add('cursor-clicking');
        shockwave.style.transition = 'none';
        shockwave.style.opacity = '0';
        shockwave.style.transform = 'scale(1)';
        setTimeout(() => {
          shockwave.style.transition = 'transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.4s ease-out';
          shockwave.style.opacity = '0.8';
          shockwave.style.transform = 'scale(1.5)';
        }, 10);
      });
      document.addEventListener('mouseup', () => {
        document.body.classList.remove('cursor-clicking');
      });
    })();
  </script>

  
  <!-- Global Particle System -->
  <script id="tdv-particles-script">
    (function() {
      const canvas = document.getElementById('tdv-particles-bg');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      let particlesArray = [];
      let animationFrameId;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 2 + 0.1;
          this.speedX = (Math.random() - 0.5) * 0.3;
          this.speedY = (Math.random() - 0.5) * 0.3;
          this.opacity = Math.random() * 0.4 + 0.1;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x > canvas.width) this.x = 0;
          else if (this.x < 0) this.x = canvas.width;
          if (this.y > canvas.height) this.y = 0;
          else if (this.y < 0) this.y = canvas.height;
        }
        draw() {
          ctx.fillStyle = `rgba(168, 85, 247, ${this.opacity})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      
      function init() {
        particlesArray = [];
        const numberOfParticles = Math.floor((canvas.width * canvas.height) / 15000);
        for (let i = 0; i < numberOfParticles; i++) {
          particlesArray.push(new Particle());
        }
      }
      
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
          particlesArray[i].update();
          particlesArray[i].draw();
        }
        animationFrameId = requestAnimationFrame(animate);
      }
      
      init();
      animate();
      
      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        init();
      });
    })();
  </script>
